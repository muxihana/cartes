<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="description" content="把角色卡帶上牌桌，陪你玩 21 點或十點半。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="牌桌">
  <title>牌桌</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      --ink: #30261f; --muted: #806f65; --paper: #fffaf5;
      --panel: rgba(255, 252, 248, .94); --line: #ddcdbb;
      --accent: #b76e79; --accent-dark: #8a5560;
      --red-suit: #a92525; --black-suit: #252321;
    }
    * { box-sizing: border-box; }
    html, body { touch-action: manipulation; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: #f7eef0; }
    button, select, input, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .app { width: min(1120px, 100%); min-height: 100vh; margin: 0 auto; padding: clamp(14px,3vw,34px); display: grid; grid-template-columns: minmax(0,1fr) minmax(245px,320px); align-items: center; gap: clamp(18px,4vw,44px); }
    .play-area { min-width: 0; }
    .heading { width: min(690px,100%); margin: 0 auto 10px; display: flex; align-items: center; gap: 10px; }
    h1 { margin: 0; font-family: "Snell Roundhand","Savoye LET","Segoe Script","Brush Script MT",cursive; font-size: clamp(1.85rem,5vw,2.6rem); line-height: 1; color: var(--accent-dark); }
    .setting-button, .turn-badge { flex: none; min-height: 34px; padding: 5px 11px; border: 1px solid #d9b2b8; border-radius: 999px; color: #a05f6a; background: #fdf7f8; font-size: .76rem; font-weight: 800; }
    .setting-button { margin-left: auto; cursor: pointer; }
    .turn-badge { display: flex; align-items: center; }
    .mode-switch { width: min(690px,100%); margin: 0 auto 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .mode-button { min-height: 42px; border: 1px solid #d9b2b8; border-radius: 9px; color: var(--ink); background: transparent; cursor: pointer; font-weight: 750; }
    .mode-button[aria-pressed="true"] { color: #fff; background: var(--accent); }
    .table-stage { position: relative; width: min(690px,100%); margin: auto; padding: 72px 0 68px; }
    .card-table { min-height: 348px; padding: clamp(16px,3vw,24px); display: grid; grid-template-rows: minmax(0,1fr) auto minmax(0,1fr); gap: 12px; border: 7px solid #6a493a; border-radius: 44px; background: #d9b7af; box-shadow: 0 14px 34px rgba(72,45,37,.22), inset 0 0 0 1px rgba(255,255,255,.35); }
    .seat { min-width: 0; display: grid; align-content: center; gap: 7px; }
    .seat-label { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; color: #614d47; font-size: .75rem; font-weight: 800; letter-spacing: .08em; }
    .points { font-variant-numeric: tabular-nums; letter-spacing: 0; }
    .hand { min-width: 0; min-height: 102px; display: flex; align-items: center; justify-content: safe center; gap: clamp(5px,1.5vw,10px); overflow-x: auto; scrollbar-width: thin; padding: 3px; }
    .playing-card { position: relative; flex: 0 0 clamp(54px,11vw,72px); height: clamp(82px,17vw,106px); padding: 6px; display: grid; place-items: center; border: 1px solid rgba(55,43,36,.22); border-radius: 9px; background: #fff; box-shadow: 0 3px 9px rgba(68,47,38,.2); font-family: Georgia,"Times New Roman",serif; user-select: none; }
    .playing-card.red { color: var(--red-suit); } .playing-card.black { color: var(--black-suit); }
    .card-corner { position: absolute; top: 5px; left: 6px; display: grid; justify-items: center; font-size: clamp(.8rem,2.5vw,1rem); font-weight: 700; line-height: .95; }
    .card-suit { font-size: clamp(1.6rem,5vw,2.35rem); line-height: 1; }
    .playing-card.back { overflow: hidden; border: 5px solid #f8eee8; background-color: #4e2438; background-image: repeating-linear-gradient(45deg,transparent 0 6px,rgba(255,255,255,.18) 6px 8px), repeating-linear-gradient(-45deg,transparent 0 6px,rgba(255,255,255,.1) 6px 8px); box-shadow: 0 3px 9px rgba(68,47,38,.25), inset 0 0 0 2px rgba(255,255,255,.4); }
    .table-message { min-height: 35px; padding: 7px 12px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(122,82,75,.18); border-radius: 999px; color: #6b4d4d; background: rgba(255,249,246,.68); font-size: .84rem; font-weight: 750; text-align: center; }
    .avatar { position: absolute; z-index: 12; cursor: pointer; width: 50px; height: 50px; overflow: hidden; border: 3px solid #fffaf3; border-radius: 50%; background: #8d796b; box-shadow: 0 3px 12px rgba(48,38,31,.3); }
    .avatar img, .avatar-fallback { display: block; width: 100%; height: 100%; }
    .avatar img { object-fit: cover; } .avatar img[hidden] { display: none; }
    .avatar-fallback { display: grid; place-items: center; color: #fff; background: #bd8d83; font-weight: 800; }
    .avatar-him { top: 0; left: -5px; } .avatar-you { right: -5px; bottom: 0; }
    .bubble-stack { position: absolute; z-index: 11; display: flex; width: calc(100% - 68px); pointer-events: none; }
    .bubble-stack-him { bottom: calc(100% - 66px); left: 61px; flex-direction: column; justify-content: flex-end; align-items: flex-start; }
    .bubble-stack-you { top: calc(100% - 63px); right: 61px; flex-direction: column; align-items: flex-end; }
    .coach-bubble, .coach-thinking { width: fit-content; max-width: min(96%,560px); margin: 0 0 5px; padding: 8px 11px; border: 1px solid rgba(122,95,73,.18); border-radius: 5px 13px 13px 13px; color: #3b3028; background: rgba(255,250,243,.96); box-shadow: 0 2px 9px rgba(72,51,36,.18); font-size: .84rem; line-height: 1.5; transform-origin: 0 0; }
    .coach-bubble.you { border-radius: 13px 5px 13px 13px; color: #553c42; background: rgba(240,224,226,.97); transform-origin: 100% 100%; }
    .coach-bubble.pop, .coach-thinking { animation: coach-pop .22s ease-out both; }
    .coach-thinking { display: flex; align-items: center; color: var(--muted); }
    @keyframes coach-pop { from { opacity: 0; transform: scale(.84); } to { opacity: 1; transform: scale(1); } }
    .thinking-dots { display: inline-flex; gap: 3px; }
    .thinking-dots i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; animation: coach-dot 1.1s infinite ease-in-out; }
    .thinking-dots i:nth-child(2) { animation-delay: .15s; } .thinking-dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes coach-dot { 0%,70%,100% { transform: translateY(0); opacity: .35; } 35% { transform: translateY(-3px); opacity: 1; } }
    .chat-row { width: min(690px,100%); margin: 0 auto 12px; display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 8px; }
    .chat-row input { min-width: 0; min-height: 44px; padding: 8px 11px; border: 1px solid #bca790; border-radius: 10px; color: var(--ink); background: #fffaf3; font-size: 16px; }
    .chat-row button { min-width: 62px; min-height: 42px; padding: 7px 11px; border: 1px solid #a05f6a; border-radius: 10px; color: #fff; background: var(--accent); cursor: pointer; font-weight: 800; }
    .chat-row input:disabled, .chat-row button:disabled { cursor: not-allowed; opacity: .5; }
    .actions { width: min(690px,100%); margin: 0 auto 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .action { min-height: 44px; border: 1px solid #a05f6a; border-radius: 9px; color: #fff; background: var(--accent); cursor: pointer; font-weight: 800; }
    .action.secondary { color: #8a5560; background: transparent; } .action.wide { grid-column: 1/-1; } .action:disabled { cursor: not-allowed; opacity: .42; }
    .panel { min-width: 0; padding: clamp(16px,2.6vw,24px); border: 1px solid rgba(122,95,73,.2); border-radius: 14px; background: var(--panel); box-shadow: 0 9px 28px rgba(72,51,36,.12); }
    .panel h2 { margin: 0 0 9px; color: var(--muted); font-size: .78rem; letter-spacing: .12em; }
    .record { margin: 0; padding: 11px 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); color: var(--muted); font-size: .8rem; line-height: 1.7; }
    .record strong { color: var(--ink); font-variant-numeric: tabular-nums; }
    .record-note { margin: 6px 0 16px; color: var(--muted); font-size: .72rem; line-height: 1.45; }
    .rule-note, .setup-note { color: var(--muted); font-size: .8rem; line-height: 1.55; }
    .setup-note { padding: 10px 11px; border-radius: 9px; background: #f9edf0; color: #7b5159; }
    .setup-note.ready { background: #edf5ee; color: #4e6d52; }
    .chatlog-overlay, .drawer-overlay { position: fixed; inset: 0; z-index: 60; display: flex; background: rgba(58,44,34,.32); }
    .chatlog-overlay { align-items: center; justify-content: center; } .chatlog-overlay[hidden], .drawer-overlay[hidden] { display: none; }
    .chatlog-panel { display: flex; flex-direction: column; width: min(440px,92vw); max-height: 74vh; border-radius: 16px; border: 1px solid rgba(122,95,73,.25); overflow: hidden; background: rgba(251,246,237,.97); box-shadow: 0 18px 44px rgba(48,38,31,.3); }
    .chatlog-head, .drawer-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 12px 10px 18px; border-bottom: 1px solid rgba(122,95,73,.12); }
    .chatlog-body { flex: 1; overflow-y: auto; padding: 8px 16px 18px; }
    .icon-close { width: 32px; height: 32px; border: 0; border-radius: 50%; background: rgba(183,110,121,.16); color: #8a5560; cursor: pointer; }
    .chatlog-title { font-size: .78rem; letter-spacing: .18em; color: #a08a8d; }
    .chatlog-actions { display: flex; align-items: center; gap: 5px; }
    .chatlog-tool { position: relative; min-height: 30px; padding: 4px 8px; display: grid; place-items: center; border: 1px solid #d9b2b8; border-radius: 7px; color: #87525b; background: #fff; cursor: pointer; font-size: .72rem; font-weight: 800; }
    .chatlog-tool input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .cl-row { display: flex; margin: 7px 0; } .cl-row.you { justify-content: flex-end; }
    .cl-bubble { max-width: 82%; padding: 8px 11px; font-size: .9rem; line-height: 1.55; border: 1px solid rgba(122,95,73,.16); }
    .cl-row.him .cl-bubble { background: #fff; border-radius: 4px 13px 13px 13px; }
    .cl-row.you .cl-bubble { background: #f0e0e2; border-radius: 13px 4px 13px 13px; }
    .cl-empty { text-align: center; color: #a08a8d; font-size: .85rem; padding: 20px 0; }
    .cl-day { text-align: center; color: #a08a8d; font-size: .7rem; letter-spacing: .1em; margin: 12px 0 4px; }
    .drawer-overlay { justify-content: flex-end; }
    .drawer { width: min(480px,100%); height: 100%; overflow-y: auto; background: #fffaf5; box-shadow: -12px 0 36px rgba(48,38,31,.2); }
    .drawer-head { position: sticky; top: 0; z-index: 2; background: #fffaf5; }
    .drawer-head h2 { margin: 0; color: var(--accent-dark); }
    .settings-form { padding: 18px; display: grid; gap: 15px; }
    fieldset { margin: 0; padding: 14px; border: 1px solid var(--line); border-radius: 11px; }
    legend { padding: 0 6px; color: var(--accent-dark); font-weight: 800; }
    .field { display: grid; gap: 5px; margin-bottom: 11px; } .field:last-child { margin-bottom: 0; }
    .field label { font-size: .8rem; color: var(--muted); font-weight: 750; }
    .field input, .field textarea { width: 100%; min-width: 0; padding: 9px 10px; border: 1px solid #bca790; border-radius: 8px; color: var(--ink); background: #fff; font-size: 16px; }
    .model-select { width: 100%; min-height: 42px; margin-top: 7px; padding: 8px 10px; border: 1px solid #bca790; border-radius: 8px; color: var(--ink); background: #fff; font-size: 16px; }
    .field textarea { min-height: 180px; resize: vertical; line-height: 1.5; }
    .inline { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 7px; align-items: stretch; }
    .quick-picks { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .quick-picks .small-button { min-height: 32px; padding-block: 4px; font-size: .75rem; }
    .card-tools, .avatar-upload-grid { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 7px; margin-bottom: 10px; }
    .avatar-upload-grid { grid-template-columns: 1fr 1fr; }
    .avatar-slot { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .avatar-preview { flex: none; width: 44px; height: 44px; overflow: hidden; border: 2px solid #e6d2c4; border-radius: 50%; background: #bd8d83; display: grid; place-items: center; color: #fff; font-weight: 800; }
    .avatar-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .avatar-preview img[hidden] { display: none; }
    .avatar-slot .upload-label { min-width: 0; }
    .small-button, .danger-button, .upload-label { min-height: 40px; padding: 7px 11px; border: 1px solid #b9828a; border-radius: 8px; color: #87525b; background: #fff; cursor: pointer; font-weight: 750; }
    .upload-label { display: grid; place-items: center; text-align: center; }
    .upload-label input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .danger-button { color: #8c3232; border-color: #c99191; }
    .status { min-height: 1.5em; margin: 0; color: var(--muted); font-size: .8rem; }
    .privacy-mini { margin: 0; color: var(--muted); font-size: .78rem; line-height: 1.55; }
    @media (prefers-reduced-motion: reduce) { .thinking-dots i, .coach-bubble, .coach-thinking { animation: none; } }
    @media (max-width: 760px) { .app { min-height: auto; display: block; padding: 12px; } .heading,.table-stage,.chat-row,.mode-switch,.actions { width: min(94vw,620px); } .panel { width: min(94vw,620px); margin: 14px auto 0; } .card-table { min-height: 330px; border-width: 6px; border-radius: 34px; } }
    @media (max-width: 410px) { .heading { gap: 6px; } .setting-button,.turn-badge { padding-inline: 8px; } .table-stage { padding-top: 68px; padding-bottom: 64px; } .card-table { min-height: 310px; padding: 13px; } .hand { min-height: 91px; } .chat-row { gap: 6px; } .chat-row button { min-width: 52px; padding-inline: 7px; } }
  </style>
</head>
<body>
  <main class="app">
    <section class="play-area" aria-label="牌桌區">
      <header class="heading">
        <h1>Cartes</h1>
        <button id="settingButton" class="setting-button" type="button">設定</button>
      </header>
      <div class="mode-switch" role="group" aria-label="選擇玩法">
        <button class="mode-button" type="button" data-mode="blackjack" aria-pressed="true">21 點</button>
        <button class="mode-button" type="button" data-mode="tenhalf" aria-pressed="false">十點半</button>
      </div>
      <div id="tableStage" class="table-stage">
        <button class="avatar avatar-him" type="button" aria-label="開啟本桌對話">
          <img id="dealerAvatar" alt="">
          <span id="dealerFallback" class="avatar-fallback">莊</span>
        </button>
        <div id="himBubbleStack" class="bubble-stack bubble-stack-him" aria-live="polite"></div>
        <div class="card-table">
          <section class="seat" aria-label="莊家的牌">
            <div class="seat-label"><span id="dealerLabel">莊家</span><span id="dealerPoints" class="points"></span></div>
            <div id="dealerHand" class="hand"></div>
          </section>
          <div id="tableMessage" class="table-message" aria-live="polite">輪你要牌或停牌</div>
          <section class="seat" aria-label="你的牌">
            <div class="seat-label"><span>你</span><span id="youPoints" class="points"></span></div>
            <div id="youHand" class="hand"></div>
          </section>
        </div>
        <div id="youBubbleStack" class="bubble-stack bubble-stack-you" aria-live="polite"></div>
        <button class="avatar avatar-you" type="button" aria-label="開啟本桌對話"><img id="playerAvatar" alt=""><span id="playerFallback" class="avatar-fallback">你</span></button>
      </div>
      <form id="chatForm" class="chat-row" autocomplete="off">
        <label class="sr-only" for="chatInput">跟莊家說話</label>
        <input id="chatInput" maxlength="300" placeholder="輸入訊息" inputmode="text">
        <button id="chatSendButton" type="submit">送出</button>
        <button id="helpButton" type="button">求救</button>
      </form>
      <div class="actions">
        <button id="hitButton" class="action" type="button">要牌</button>
        <button id="standButton" class="action secondary" type="button">停牌</button>
        <button id="newGameButton" class="action secondary wide" type="button">新局</button>
      </div>
    </section>
    <aside class="panel" aria-label="牌局帳">
      <h2>本模式戰績</h2>
      <p id="record" class="record">你贏 <strong>0</strong> ／ 莊贏 <strong>0</strong> ／ 平 <strong>0</strong></p>
      <p class="record-note">備份與還原在對話視窗（點頭像開啟）</p>
      <p id="setupNote" class="setup-note">設定完成後莊家會開口</p>
      <p id="ruleNote" class="rule-note"></p>
    </aside>
  </main>

  <div id="settingsOverlay" class="drawer-overlay" hidden>
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <header class="drawer-head"><h2 id="settingsTitle">牌桌設定</h2><button class="icon-close" type="button" data-close-settings aria-label="關閉">×</button></header>
      <form id="settingsForm" class="settings-form">
        <fieldset>
          <legend>API</legend>
          <div class="quick-picks" aria-label="服務商快選">
            <button class="small-button" type="button" data-endpoint-preset="google">Google AI Studio</button>
            <button class="small-button" type="button" data-endpoint-preset="openrouter">OpenRouter</button>
            <button class="small-button" type="button" data-endpoint-preset="custom">自訂</button>
          </div>
          <div class="field"><label for="endpointInput">端點網址</label><input id="endpointInput" name="endpoint" autocomplete="url"></div>
          <div class="field"><label for="apiKeyInput">金鑰</label><div class="inline"><input id="apiKeyInput" name="apiKey" type="password" autocomplete="off"><button id="toggleKeyButton" class="small-button" type="button">顯示</button></div></div>
          <!-- datalist 退役（業主 08-31 手機檢舉：格內有字時建議被前綴過濾＝清單像消失）→ 真下拉選單 -->
          <div class="field"><label for="modelInput">模型名</label><div class="inline"><input id="modelInput" name="model" autocomplete="off"><button id="loadModelsButton" class="small-button" type="button">撈清單</button></div><select id="modelSelect" class="model-select" hidden></select></div>
          <p id="modelStatus" class="status" aria-live="polite"></p>
        </fieldset>
        <fieldset>
          <legend>角色卡</legend>
          <div class="card-tools">
            <label class="upload-label">上傳檔案<input id="cardFileInput" type="file" accept=".png,.json,.md,.txt,image/png,application/json,text/plain,text/markdown"></label>
            <button id="exportCardButton" class="small-button" type="button">匯出卡</button>
          </div>
          <p id="cardStatus" class="status" aria-live="polite">上傳會覆蓋下方欄位；也可以直接手填。</p>
          <div class="field"><label for="characterNameInput">角色名</label><input id="characterNameInput" name="characterName" autocomplete="off"></div>
          <div class="field"><label for="characterDescriptionInput">角色描述</label><textarea id="characterDescriptionInput" name="characterDescription" placeholder="外觀、性格、說話風格"></textarea></div>
          <div class="field"><label for="playerNameInput">玩家稱呼（他怎麼叫你）</label><input id="playerNameInput" name="playerName" value="你" autocomplete="off"></div>
          <!-- 抽屜內即時預覽（業主 08-31 檢舉「傳了不會顯示」＝桌角頭像被抽屜蓋住、傳的地方看不到成果） -->
          <div class="avatar-upload-grid">
            <div class="avatar-slot"><span class="avatar-preview"><img id="dealerAvatarPreview" alt="" hidden><span id="dealerPreviewEmpty">莊</span></span><label class="upload-label">他的頭像<input id="dealerAvatarInput" type="file" accept="image/*"></label></div>
            <div class="avatar-slot"><span class="avatar-preview"><img id="playerAvatarPreview" alt="" hidden><span id="playerPreviewEmpty">你</span></span><label class="upload-label">你的頭像<input id="playerAvatarInput" type="file" accept="image/*"></label></div>
          </div>
          <p id="avatarStatus" class="status" aria-live="polite">頭像會縮至 256 像素後儲存。</p>
        </fieldset>
        <p class="privacy-mini">資料只存在這個瀏覽器的本站儲存空間。牌桌沒有後端，也不會替你傳走金鑰或角色卡。</p>
        <button id="clearButton" class="danger-button" type="button">清除所有資料</button>
      </form>
    </aside>
  </div>

  <div id="chatlogOverlay" class="chatlog-overlay" hidden>
    <div class="chatlog-panel" role="dialog" aria-modal="true" aria-labelledby="chatlogTitle">
      <div class="chatlog-head">
        <span id="chatlogTitle" class="chatlog-title">本桌對話（0/100）</span>
        <div class="chatlog-actions">
          <button id="exportMemoryButton" class="chatlog-tool" type="button">匯出</button>
          <label class="chatlog-tool">匯入<input id="memoryFileInput" type="file" accept=".png,.json,.md,.txt,image/png,application/json,text/plain,text/markdown"></label>
          <button class="icon-close" type="button" data-close-chatlog aria-label="關閉">×</button>
        </div>
      </div>
      <div id="chatlogBody" class="chatlog-body"></div>
    </div>
  </div>

  <script>
    (() => {
      "use strict";
      const RULES = Object.freeze({
        blackjack: Object.freeze({ label: "21 點", limit: 21, dealerStand: 17, openingCards: 2 }),
